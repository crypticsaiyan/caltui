[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "caltui"
version = "0.1.0"
description = "Terminal UI Google Calendar client"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.70.0",
    "google-api-python-client>=2.142.0",
    "google-auth-oauthlib>=1.3.1",
    "google-auth>=2.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[project.scripts]
caltui = "main:main"

[tool.hatch.build.targets.wheel]
include = [
    "main.py",
    "models.py",
    "auth/**",
    "api/**",
    "ui/**",
    "config/**",
]
